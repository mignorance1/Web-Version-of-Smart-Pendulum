<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>语音启动实验演示</title>
  <style>
    body {
      background: #f8fafc;
      font-family: "PingFang SC", "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #000000;
      font-size: 18px;
    }
    .panel {
      width: 800px;
      height: 420px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      padding: 28px;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title {
      color: #000000;
      font-size: 26px;
      font-weight: 700;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #000000;
      font-size: 17px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .chat {
      flex: 1;
      background: #f1f5f9;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bubble {
      max-width: 75%;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 18px;
      line-height: 1.7;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }
    .user {
      align-self: flex-end;
      background: #dbeafe;
      color: #0f172a;
      border-bottom-right-radius: 6px;
    }
    .assistant {
      align-self: flex-start;
      background: #fff;
      color: #111827;
      border-bottom-left-radius: 6px;
    }
    .note {
      margin-top: 18px;
      font-size: 14px;
      color: #6b7280;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="title">语音启动实验</div>
      <div class="status">
        <span class="status-dot"></span>
        实验流程联动
      </div>
    </div>
    <div class="chat">
      <div class="bubble user">语音：设置计数周期为十次。</div>
      <div class="bubble assistant">已设置计数周期为 10 次，串口发送 c10。</div>
      <div class="bubble user">语音：开始实验。</div>
      <div class="bubble assistant">实验流程已启动：d1 吸附→d0 放球→计时记录同步开启。</div>
      <div class="bubble user">语音：设置计数周期为二十次。</div>
      <div class="bubble assistant">计数周期已更新为 20 次，准备下一次实验。</div>
    </div>
    <div class="note">说明：语音助手通过串口发送 d0/d1/cN 等指令，实现一键化的实验启动与参数设置。</div>
  </div>
</body>
</html>
